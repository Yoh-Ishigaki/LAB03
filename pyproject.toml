[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weathersummary"
version = "1.0.0"
description = "AIGC 5005 Lab 03 weather summary package"
requires-python = ">=3.11"
dependencies = [
    "requests==2.32.5",
]

[tool.setuptools.packages.find]
where = ["src"]
